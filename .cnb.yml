main:
  push:
    - name: 构建并部署后端
      docker:
        image: golang:1.27.1-alpine
      services:
        - docker
      imports: https://cnb.cool/longlian.online/env/-/blob/main/yukibloom-backend.yml
      stages:
        - name: 安装构建工具
          script: apk add --no-cache docker-cli openssh-client
        - name: 检查 Go 代码
          script: |
            go test ./...
            go vet ./...
        - name: 构建并推送镜像
          script: |
            docker build \
              -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:main" \
              -t "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}" .
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:main"
            docker push "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT}"
        - name: 部署到服务器
          script: |
            set -eu
            printf '%s' "$SERVER_SSH_KEY_BASE64" | base64 -d > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            ssh-keyscan -H "$SERVER_HOST" > /tmp/known_hosts 2>/dev/null
            scp -i /tmp/deploy_key -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes \
              compose.yaml "$SERVER_USER@$SERVER_HOST:/srv/YukiBloom-backend/compose.yaml"
            ssh -i /tmp/deploy_key -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes \
              "$SERVER_USER@$SERVER_HOST" \
              "IMAGE_TAG=${CNB_COMMIT} sh -c 'set -eu; cd /srv/YukiBloom-backend; docker compose pull api; docker compose up -d --no-build api; curl --fail --retry 15 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/v1/health'"
            rm -f /tmp/deploy_key /tmp/known_hosts
