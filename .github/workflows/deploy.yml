name: 检查并同步到 CNB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-sync-main
  cancel-in-progress: false

jobs:
  verify:
    name: Go 检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试与静态检查
        run: |
          go test ./...
          go vet ./...

  sync-to-cnb:
    name: 同步 main 到 CNB
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 推送 main 到 CNB
        env:
          CNB_SYNC_TOKEN: ${{ secrets.CNB_SYNC_TOKEN }}
        run: |
          set -eu
          if [ -z "$CNB_SYNC_TOKEN" ]; then
            echo "Missing GitHub Actions secret: CNB_SYNC_TOKEN" >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/cnb-askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' cnb ;;
            *Password*) printf '%s\n' "$CNB_SYNC_TOKEN" ;;
          esac
          EOF
          chmod 700 "$RUNNER_TEMP/cnb-askpass"
          GIT_ASKPASS="$RUNNER_TEMP/cnb-askpass" GIT_TERMINAL_PROMPT=0 \
            git push https://cnb.cool/longlian.online/yukibloom-backend.git HEAD:main
